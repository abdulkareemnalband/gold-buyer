<div class="flex min-h-dvh flex-col bg-stone-50 text-stone-900 dark:bg-stone-950 dark:text-stone-100">
  <header
    class="sticky top-0 z-10 border-b border-stone-200 bg-white/95 px-3 py-2 backdrop-blur dark:border-stone-800 dark:bg-stone-900/95"
  >
    <div class="mx-auto max-w-xl">
      <div class="flex items-center justify-between gap-2">
        <h1 class="text-sm font-semibold">Gold Buyer</h1>
        <button
          type="button"
          class="btn-quiet"
          aria-haspopup="dialog"
          [attr.aria-expanded]="sheetOpen()"
          (click)="sheetOpen.set(true)"
        >
          {{ store.activeCollection()?.title || 'Shops' }}
          <span aria-hidden="true">▾</span>
        </button>
      </div>

      <div class="mt-2">
        <app-rate-bar />
      </div>
    </div>
  </header>

  <!-- The bottom padding keeps the last card clear of the sticky totals bar. -->
  <main class="mx-auto w-full max-w-xl flex-1 px-3 pt-3 pb-28">
    @if (store.ready()) {
      <ul class="flex flex-col gap-3">
        @for (article of store.activeArticles(); track article.id) {
          <li>
            <app-article-card [article]="article" (removed)="remove(article.id)" />
          </li>
        } @empty {
          <li class="card muted p-6 text-center text-sm">
            No jewellery yet. Enter the shop's rate above, then add the first piece.
          </li>
        }
      </ul>

      <button type="button" class="btn-primary mt-3 w-full" (click)="add()">
        Add a piece of jewellery
      </button>
    } @else {
      <p class="muted p-6 text-center text-sm" role="status">Opening your saved shops…</p>
    }
  </main>

  <div class="sticky bottom-0 z-10">
    <app-summary-bar />
  </div>

  <app-collection-sheet [open]="sheetOpen()" (closed)="sheetOpen.set(false)" />
</div>
